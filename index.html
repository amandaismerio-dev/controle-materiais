<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Controle de Materiais</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%A6%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#eef1f4;--surface:#fff;--surface2:#f3f5f8;--text:#18212c;--muted:#5d6978;--line:#d9dfe6;--focus:#1f6fd0;
  --pri:#1f5fa8;--pri-h:#17497f;--ok:#2d7a28;--ok-h:#23601f;--bad:#a32424;--bad-h:#821b1b;
  --info-bg:#e1edfa;--info-fg:#174d8a;--ok-bg:#e4f1e1;--ok-fg:#27661f;--bad-bg:#fbe5e5;--bad-fg:#8f1f1f;
  --loc-bg:#ebe6f8;--loc-fg:#533299;--warn-bg:#faeed2;--warn-fg:#7a4a05;--mark:#fbe38a;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0f1318;--surface:#181e26;--surface2:#212a35;--text:#e7ebf0;--muted:#97a3b3;--line:#2c3643;--focus:#6aa8f0;
  --pri:#2b6bb8;--pri-h:#3a7bc9;--ok:#368a30;--ok-h:#43a03c;--bad:#c23a3a;--bad-h:#d64d4d;
  --info-bg:#173152;--info-fg:#9cc7f4;--ok-bg:#173a15;--ok-fg:#a6dba0;--bad-bg:#4a1c1c;--bad-fg:#f2aaaa;
  --loc-bg:#2d2350;--loc-fg:#cbb9f5;--warn-bg:#47330f;--warn-fg:#f0cf8a;--mark:#6b5a12;
}}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;color:var(--text);background:var(--bg);padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
body.noscroll{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:12px}
h1{font-size:17px;font-weight:700}
h3{font-size:16px;font-weight:700}
mark{background:var(--mark);color:inherit;border-radius:2px;padding:0 1px}
code{background:var(--surface2);padding:1px 5px;border-radius:4px;font-size:12px}

/* topo */
.top{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.top-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.stats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.stat{flex:1 1 90px;background:var(--surface2);border-radius:8px;padding:6px 10px}
.stat b{display:block;font-size:19px;line-height:1.2}
.stat span{font-size:11px;color:var(--muted)}
.tabs{display:flex;gap:4px;overflow-x:auto;padding-bottom:2px;scrollbar-width:thin}
.tab{flex:0 0 auto;border:1px solid transparent;background:transparent;color:var(--muted);font-weight:600;font-size:13px;padding:8px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.tab:hover{background:var(--surface2);color:var(--text)}
.tab.on{background:var(--surface2);border-color:var(--line);color:var(--text)}
.notif{display:inline-block;margin-left:5px;min-width:18px;text-align:center;font-size:11px;font-weight:700;padding:1px 6px;border-radius:99px;background:var(--bad);color:#fff}

/* controles */
.btn{font-weight:600;font-size:13px;min-height:36px;padding:6px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface2)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn.pri:hover{background:var(--pri-h)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}.btn.ok:hover{background:var(--ok-h)}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}.btn.bad:hover{background:var(--bad-h)}
.btn.ghost-bad{color:var(--bad-fg);border-color:var(--bad)}
.btn.sm{min-height:32px;padding:4px 10px;font-size:12px}
.link{background:none;border:0;color:var(--info-fg);text-decoration:underline;cursor:pointer;font-size:12px;padding:0 2px}
input,select,textarea{width:100%;min-height:38px;padding:7px 10px;font-size:16px;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
textarea{min-height:70px;resize:vertical}
label{display:block;font-size:12px;color:var(--muted);margin:0 0 3px}
.field{margin-bottom:12px}
.row2{display:flex;gap:10px}.row2>*{flex:1;min-width:0}
.hint{font-size:12px;color:var(--muted);margin-bottom:8px;line-height:1.5}
.erro{font-size:13px;color:var(--bad-fg);min-height:18px;margin:4px 0 8px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.bar input[type=search]{flex:1 1 200px}
.bar select{flex:0 1 auto;width:auto;min-width:140px}
.check{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);margin:0;cursor:pointer}
.check input{width:auto;min-height:0}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg-b{border:1px solid var(--line);background:transparent;color:var(--muted);font-size:12px;font-weight:600;padding:5px 12px;border-radius:8px;cursor:pointer}
.seg-b.on{background:var(--surface2);color:var(--text);border-color:var(--muted)}

/* selos */
.badge{display:inline-flex;align-items:center;gap:3px;padding:2px 8px;border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap}
.b-info{background:var(--info-bg);color:var(--info-fg)}.b-ok{background:var(--ok-bg);color:var(--ok-fg)}
.b-bad{background:var(--bad-bg);color:var(--bad-fg)}.b-loc{background:var(--loc-bg);color:var(--loc-fg)}
.b-warn{background:var(--warn-bg);color:var(--warn-fg)}.b-mute{background:var(--surface2);color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:3px;background:var(--surface2);color:var(--muted);padding:1px 8px;border-radius:99px;font-size:11px}

/* itens */
.item{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-left-width:3px;border-radius:10px;padding:10px 12px;margin-bottom:6px}
.item.is-rec{opacity:.72}
.item-main{flex:1;min-width:0}
.item-nome{font-weight:600;font-size:14px;overflow-wrap:anywhere}
.meta{display:flex;flex-wrap:wrap;gap:5px;align-items:center;font-size:12px;color:var(--muted);margin-top:3px}
.obs{font-size:12px;color:var(--muted);font-style:italic;margin-top:4px;overflow-wrap:anywhere}
.recinfo{font-size:12px;color:var(--ok-fg);margin-top:4px}
.item-act{display:flex;flex-direction:column;gap:6px;align-items:stretch;flex:0 0 auto}
.chegou{min-width:96px;min-height:40px;font-weight:700;font-size:13px;border-radius:8px;border:1px solid var(--line);background:var(--surface);cursor:pointer}
.chegou:hover{border-color:var(--ok);color:var(--ok-fg)}
.chegou.on{background:var(--ok);border-color:var(--ok);color:#fff}
.chegou.on:hover{background:var(--bad);border-color:var(--bad);color:#fff}
.item.est-ret{border-left-color:var(--muted)}
.item.est-livre{border-left-color:var(--ok)}.item.est-dest{border-left-color:#c58a1a}.item.est-comprar{border-left-color:var(--bad)}
@media (max-width:520px){.item{flex-direction:column}.item-act{flex-direction:row;width:100%}.item-act>*{flex:1}}

/* projetos */
.proj{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:10px}
.proj.oculto{opacity:.55}
.proj-h{display:flex;align-items:center;gap:8px;padding:10px 12px;flex-wrap:wrap}
.proj-toggle{flex:1 1 180px;display:flex;align-items:center;gap:8px;background:none;border:0;text-align:left;cursor:pointer;min-height:36px}
.proj-toggle b{font-size:15px;overflow-wrap:anywhere}
.proj-b{padding:0 12px 10px}
.proj-b .item{margin-bottom:0;border-radius:0;border-width:0 0 1px 0;border-left-width:0;padding-left:0;padding-right:0}
.proj-b .item:last-child{border-bottom:0}

/* cartões do estoque */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px;margin-bottom:12px}
.card-b{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;text-align:left;cursor:pointer}
.card-b.sel{border-color:var(--pri);background:var(--surface2)}
.card-b b{display:block;font-size:22px}.card-b span{font-size:12px;color:var(--muted)}

/* compras / avisos */
.grp{margin-bottom:16px}
.grp-t{font-size:13px;font-weight:700;color:var(--muted);margin-bottom:8px}
.aviso{background:var(--surface);border:1px solid var(--line);border-left-width:3px;border-radius:10px;padding:10px 12px;margin-bottom:8px}
.aviso.comprar{border-left-color:var(--bad)}.aviso.aloc{border-left-color:#7b5bd0}
.aviso-l{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:6px 0;border-top:1px solid var(--line);font-size:13px}
.aviso-l:first-of-type{border-top:0}
.aviso-l .nome{flex:1 1 160px;overflow-wrap:anywhere}

/* mensagens */
.msg{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;max-width:640px}
.msg.mine{margin-left:auto;background:var(--surface2)}
.msg-h{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);margin-bottom:3px;flex-wrap:wrap}
.msg-h strong{color:var(--text);font-size:13px}
.msg-t{white-space:pre-wrap;overflow-wrap:anywhere}
.compose{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.tpl{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}

.prevs{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0}
.prev{position:relative}
.prev img{height:72px;width:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line);display:block}
.prev .rm{position:absolute;top:-8px;right:-8px;background:var(--surface);border:1px solid var(--line);border-radius:99px;width:24px;height:24px;font-size:12px;padding:0;line-height:22px;cursor:pointer}
.thumbs{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.thumb{border:1px solid var(--line);background:var(--surface2);border-radius:8px;padding:0;cursor:pointer;overflow:hidden;min-height:44px;color:var(--muted);font-size:12px}
.thumb img{display:block;width:120px;height:120px;object-fit:cover}
.thumb.vazio{padding:10px 12px;cursor:default}
.thumb.vazio[data-act]{cursor:pointer}
.big{max-width:100%;max-height:78vh;display:block;margin:0 auto;border-radius:8px}
.mc.wide{width:min(900px,100%)}
.ped{border-left:3px solid var(--bad);padding-left:10px;margin-bottom:4px}
.ped-i{font-size:15px;font-weight:600;margin:3px 0;overflow-wrap:anywhere}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.pc-top{display:flex;gap:12px;padding:10px 12px;align-items:flex-start}
.pthumb{flex:0 0 auto;width:68px;height:68px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);display:flex;align-items:center;justify-content:center;font-size:28px;padding:0;overflow:hidden;cursor:pointer;color:var(--muted)}
.pthumb img{width:100%;height:100%;object-fit:cover;display:block}
.pc-info{flex:1;min-width:0}
.pc-nome{font-weight:700;font-size:15px;overflow-wrap:anywhere}
.pc-act{flex:0 0 auto}
.frows{border-top:1px solid var(--line)}
.frow{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.frow.best{background:var(--ok-bg)}
.frow.sem .fr-preco{text-decoration:line-through;opacity:.7}
.fr-main{flex:1 1 230px;min-width:0}
.fr-nome{font-weight:600;font-size:13px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fr-preco{font-size:17px;font-weight:700;margin-top:3px}
.fr-preco small{font-size:12px;font-weight:500;color:var(--muted)}
.fr-meta{font-size:12px;color:var(--muted);margin-top:3px;overflow-wrap:anywhere}
.fr-act{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pc-foot{padding:8px 12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tr-up{color:var(--bad-fg);font-weight:700}.tr-down{color:var(--ok-fg);font-weight:700}
a.btn{display:inline-flex;align-items:center;text-decoration:none;color:inherit}
.fphotos{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.fph{width:96px;text-align:center}
.fph .pimg{width:96px;height:96px;border-radius:10px;border:1px solid var(--line);overflow:hidden;background:var(--surface2);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:11px}
.fph .pimg img{width:100%;height:100%;object-fit:cover}
.fph.main .pimg{border:2px solid var(--ok)}
.fph .btn{width:100%;margin-top:4px;padding:2px 4px;min-height:28px;font-size:11px}
.gal{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:10px}
.gal button{width:60px;height:60px;padding:0;border:2px solid var(--line);border-radius:8px;overflow:hidden;background:none;cursor:pointer;color:var(--muted)}
.gal button.on{border-color:var(--pri)}
.gal img{width:100%;height:100%;object-fit:cover;display:block}
.empty{text-align:center;padding:32px 16px;color:var(--muted);font-size:14px}

/* janelas */
.mb{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:400;display:flex;align-items:center;justify-content:center;padding:12px}
.mc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;width:min(540px,100%);max-height:92vh;overflow-y:auto}
.mc.small{width:min(400px,100%);text-align:center}
.mt{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.x{background:none;border:0;font-size:20px;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px}
.acts{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap;margin-top:14px}
.acts .sp{flex:1}
.sect{font-size:12px;font-weight:700;color:var(--muted);margin:16px 0 8px}
.tchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.tchip{border:1px solid var(--line);background:transparent;color:var(--muted);font-weight:600;font-size:12px;padding:6px 14px;border-radius:99px;cursor:pointer}
.tchip.on[data-t=forn]{background:var(--info-bg);color:var(--info-fg);border-color:var(--info-fg)}
.tchip.on[data-t=comprar]{background:var(--bad-bg);color:var(--bad-fg);border-color:var(--bad-fg)}
.tchip.on[data-t=aloc]{background:var(--loc-bg);color:var(--loc-fg);border-color:var(--loc-fg)}
.lb-row{display:grid;grid-template-columns:1fr 90px 1fr 36px;gap:6px;align-items:end;margin-bottom:8px}
@media (max-width:520px){.lb-row{grid-template-columns:1fr 1fr;}.lb-row>div:first-child{grid-column:1/-1}}
.al-row{display:flex;gap:6px;align-items:end;margin-bottom:6px}
.al-row .al-p{flex:1}.al-row .al-q{width:90px}
.conf-ico{font-size:34px;margin-bottom:6px}
.mc.small p{font-size:14px;color:var(--muted);margin:6px 0 16px;line-height:1.55}
.conf-btns{display:flex;gap:10px;justify-content:center}
.menu-b{display:block;width:100%;text-align:left;margin-bottom:8px}

/* entrada */
.gate{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:16px}
.gate-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px;width:min(400px,100%)}
.gate-card h1{margin-bottom:8px}
.gate-card p{font-size:14px;color:var(--muted);margin-bottom:14px;line-height:1.55}
.gate-card .btn{width:100%;margin-top:4px}

#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#1f2630;color:#fff;padding:9px 18px;border-radius:99px;font-size:13px;z-index:900;opacity:0;pointer-events:none;transition:opacity .25s;max-width:92vw;text-align:center}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>

<div id="gate" class="gate" hidden></div>

<div id="app" hidden>
<div class="wrap">
  <header class="top">
    <div class="top-row">
      <h1>📦 Controle de Materiais</h1>
      <button class="btn sm" data-act="menu" id="btn-user" aria-haspopup="dialog"></button>
    </div>
    <div class="stats" id="stats"></div>
    <nav class="tabs" id="tabs" aria-label="Seções"></nav>
  </header>

  <main>
    <section class="page" id="page-mat" hidden>
      <div class="bar">
        <input id="f-mat-q" type="search" placeholder="Buscar material ou fornecedor…" aria-label="Buscar material ou fornecedor" autocomplete="off">
        <select id="f-mat-proj" aria-label="Filtrar por projeto"></select>
        <select id="f-mat-st" aria-label="Filtrar por situação">
          <option value="pend">A caminho</option><option value="rec">Já chegaram</option><option value="">Todos</option>
        </select>
      </div>
      <p class="hint" id="hint-mat">Materiais já comprados que ainda estão a caminho. Quando chegar, toque em <b>Chegou</b>. O que ainda falta comprar fica na aba <b>Compras</b>.</p>
      <div id="list-mat"></div>
    </section>

    <section class="page" id="page-proj" hidden>
      <div class="bar">
        <input id="f-proj-q" type="search" placeholder="Buscar projeto…" aria-label="Buscar projeto" autocomplete="off">
        <label class="check"><input type="checkbox" id="f-proj-ocultos"> Ver ocultos</label>
        <button class="btn pri" data-act="novo-proj">+ Novo projeto</button>
      </div>
      <div id="list-proj"></div>
    </section>

    <section class="page" id="page-est" hidden>
      <div class="cards">
        <button class="card-b" id="ec-todos" data-act="est-card" data-v=""><b id="en-todos">0</b><span>Em estoque (total)</span></button>
        <button class="card-b" id="ec-livre" data-act="est-card" data-v="livre"><b id="en-livre">0</b><span>Livres (sem projeto)</span></button>
        <button class="card-b" id="ec-dest" data-act="est-card" data-v="dest"><b id="en-dest">0</b><span>Destinados a projeto</span></button>
        <button class="card-b" id="ec-ret" data-act="est-card" data-v="ret"><b id="en-ret">0</b><span>Já retirados</span></button>
      </div>
      <div class="bar">
        <input id="f-est-q" type="search" placeholder="Buscar material ou fornecedor…" aria-label="Buscar no estoque" autocomplete="off">
        <select id="f-est-proj" aria-label="Filtrar por projeto"></select>
        <select id="f-est-st" aria-label="Filtrar por situação">
          <option value="">Em estoque (todos)</option><option value="livre">Só livres</option><option value="dest">Só destinados</option><option value="ret">Já retirados</option><option value="comprar">Falta comprar</option>
        </select>
        <button class="btn pri" data-act="novo-est">+ Adicionar ao estoque</button>
      </div>
      <div id="list-est"></div>
    </section>

    <section class="page" id="page-compras" hidden>
      <div class="bar">
        <input id="f-cp-q" type="search" placeholder="Buscar material, projeto, fornecedor ou quem pediu…" aria-label="Buscar em compras" autocomplete="off">
        <select id="f-cp-proj" aria-label="Filtrar por projeto"></select>
        <select id="f-cp-st" aria-label="Filtrar por situação">
          <option value="comprar">Precisa comprar</option><option value="comprado">Já comprado</option><option value="">Todos</option>
        </select>
        <button class="btn" data-act="export">Exportar lista</button>
        <button class="btn pri" data-act="pedir">+ Adicionar para comprar</button>
      </div>
      <div id="list-compras"></div>
      <div id="list-aloc"></div>
    </section>

    <section class="page" id="page-cot" hidden>
      <div class="seg" id="cot-seg">
        <button class="seg-b on" data-act="cot-view" data-v="prod">💲 Produtos e preços</button>
        <button class="seg-b" data-act="cot-view" data-v="forn">🏪 Fornecedores</button>
      </div>
      <div id="cot-prod">
        <div class="bar">
          <input id="f-cot-q" type="search" placeholder="Buscar produto, apelido ou marca…" aria-label="Buscar produto" autocomplete="off">
          <button class="btn pri" data-act="p-novo">+ Novo produto</button>
          <button class="btn" data-act="p-lista">Colar lista</button>
        </div>
        <div id="list-cot"></div>
      </div>
      <div id="cot-forn" hidden>
        <div class="bar"><button class="btn pri" data-act="f-novo">+ Novo fornecedor</button></div>
        <div id="list-forn"></div>
      </div>
    </section>

    <section class="page" id="page-msg" hidden>
      <div class="compose">

        <textarea id="msg-txt" rows="3" maxlength="2000" placeholder="Ex.: Recebi os eletrodutos hoje. / Chegou uma caixa e não sei de quem é, alguém sabe?"></textarea>
        <div class="tpl">
          <button class="btn pri sm" data-act="pedir">🛒 Pedir material</button>
          <button class="btn sm" data-act="foto-add">📷 Foto</button>
          <button class="btn sm" data-act="msg-tpl" data-t="Recebido: ">✓ Recebido</button>
          <button class="btn sm" data-act="msg-tpl" data-t="Comprado: ">🛒 Comprado</button>

<div class="mb" id="modal" hidden><div class="mc" id="modal-box" role="dialog" aria-modal="true"></div></div>
<div class="mb" id="confirm" hidden style="z-index:600"><div class="mc small" id="confirm-box" role="alertdialog" aria-modal="true"></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
(function(){
'use strict';

/* ---------- Ligação com o banco (chave pública; os dados só abrem com o código da equipe) ---------- */
var SUPABASE_URL = 'https://kqgkljfpwzpqkwnlplbt.supabase.co';
var SUPABASE_KEY = 'sb_publishable_8b0gABcRFKa1wxriIVXLQA__qXMChku';

/* ---------- Estado ---------- */
var S = { projetos:[], itens:[], estoque:[], mensagens:[], fornecedores:[], produtos:[], precos:[] };
var BASE = ['projetos','itens','estoque','mensagens'];
var COT = ['fornecedores','produtos','precos'];   // só carregam na aba Cotação
var TABELAS = BASE.concat(COT);
var cotView = 'prod';
var pf = null;                 // formulário de produto aberto
var galIds = null, galCur = 0; // galeria de fotos aberta
var codigo = lsGet('cm_codigo') || '';
var nome = lsGet('cm_nome') || '';
var uid = lsGet('cm_uid') || '';
var lido = lsGet('cm_lido') || '';
var tab = 'mat';
var abertos = {};          // pastas de projeto abertas (só neste aparelho)
var logado = false;
var pend = 0;
var seq = 0;
var avisouRede = false;
var confirmOk = null;
var anexos = [];           // fotos escolhidas no compositor: {id, dataUrl}
var fotoCache = {};        // id -> dataUrl
var fotoCarregando = {};
var fotoTentou = {};
var fotoFalhou = {};
var enviando = false;
var msgKey = null;

function lsGet(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function lsDel(k){ try{ localStorage.removeItem(k); }catch(e){} }

function $(id){ return document.getElementById(id); }
function val(id){ var e=$(id); return e ? e.value.trim() : ''; }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function hl(s,q){
  s = String(s==null?'':s);
  if(!q) return esc(s);
  var low=s.toLowerCase(), ql=q.toLowerCase(), out='', i=0, j;
  while((j=low.indexOf(ql,i))>=0){ out+=esc(s.slice(i,j))+'<mark>'+esc(s.slice(j,j+q.length))+'</mark>'; i=j+q.length; }
  return out+esc(s.slice(i));
}
function fmt(iso){
  if(!iso) return '—';
  var d=new Date(iso); if(isNaN(d)) return '—';
  return d.toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
}
function newId(){ seq=(seq+1)%1296; return 'x'+Date.now().toString(36)+('0'+seq.toString(36)).slice(-2)+Math.random().toString(36).slice(2,6); }
function ord(){ seq=(seq+1)%1000; return Date.now()*1000+seq; }
if(!uid){ uid=newId(); lsSet('cm_uid',uid); }

var toastT;
function toast(msg){
  var t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT); toastT=setTimeout(function(){ t.classList.remove('show'); },2600);
}

/* ---------- Chamadas ao banco ---------- */
function rpc(fn,args){
  return fetch(SUPABASE_URL+'/rest/v1/rpc/'+fn,{
    method:'POST',
    headers:{'Content-Type':'application/json','apikey':SUPABASE_KEY},
    body:JSON.stringify(args||{})
  }).then(function(res){
    if(!res.ok) throw {tipo:'http',status:res.status};
    return res.json();
  },function(){ throw {tipo:'rede'}; });
}

function flat(r){ var o=Object.assign({},r.dados); o.id=r.id; o.criado_em=r.criado_em; return o; }

function carregar(todas){
  var lista=(todas||tab==='cot')?TABELAS:BASE;
  return Promise.all(lista.map(function(t){ return rpc('app_listar',{p_codigo:codigo,p_tabela:t}); })).then(function(rs){
    for(var i=0;i<rs.length;i++){
      if(rs[i].erro==='invalido'||rs[i].erro==='sem_codigo'){
        codigo=''; lsDel('cm_codigo'); logado=false;
        mostrarEntrar('O código foi alterado ou não confere. Digite o código atual.');
        return false;
      }
      if(rs[i].erro==='bloqueado'){ logado=false; mostrarEntrar('Muitas tentativas erradas. Aguarde 10 minutos e tente de novo.'); return false; }
      if(!rs[i].ok){ if(COT.indexOf(lista[i])>=0){ rs[i]={ok:true,registros:null}; continue; } throw {tipo:'erro',detalhe:rs[i].erro}; }
    }
    lista.forEach(function(t,i){
      if(!rs[i].registros) return;
      var arr=rs[i].registros.map(flat);
      if(t==='itens'||t==='estoque') arr.sort(function(a,b){ return (a.ord||0)-(b.ord||0); });
      S[t]=arr;
    });
    avisouRede=false;
    return true;
  });
}

function gravar(tabela,obj){
  var dados=Object.assign({},obj); delete dados.id; delete dados.criado_em; delete dados.atualizado_em;
  pend++;
  return rpc('app_gravar',{p_codigo:codigo,p_tabela:tabela,p_id:obj.id,p_dados:dados}).then(function(r){
    if(!r.ok) throw {tipo:'erro',detalhe:r.erro};
  }).catch(falhaGravar).then(function(){ pend--; });
}
function gravarVarios(tabela,lista){
  if(!lista.length) return Promise.resolve();
  var regs=lista.map(function(o){ var d=Object.assign({},o); delete d.id; delete d.criado_em; delete d.atualizado_em; return {id:o.id,dados:d}; });
  pend++;
  return rpc('app_gravar_varios',{p_codigo:codigo,p_tabela:tabela,p_registros:regs}).then(function(r){
    if(!r.ok) throw {tipo:'erro',detalhe:r.erro};
  }).catch(falhaGravar).then(function(){ pend--; });
}
function excluirVarios(tabela,ids){
  if(!ids.length) return Promise.resolve();
  pend++;
  return rpc('app_excluir_varios',{p_codigo:codigo,p_tabela:tabela,p_ids:ids}).then(function(r){
    if(!r.ok) throw {tipo:'erro',detalhe:r.erro};
  }).catch(falhaGravar).then(function(){ pend--; });
}
function falhaGravar(e){
  toast(e&&e.tipo==='rede' ? 'Sem conexão. A alteração não foi salva.' : 'Não foi possível salvar. Atualizando os dados…');
  setTimeout(atualizar,800);
}
function upsert(t,obj){
  var i=S[t].findIndex(function(x){ return x.id===obj.id; });
  if(i>=0) S[t][i]=obj; else S[t].push(obj);
}

function atualizar(){
  if(!logado||pend>0) return Promise.resolve();
  return carregar().then(function(ok){ if(ok) renderAll(); }).catch(function(){
    if(!avisouRede){ avisouRede=true; toast('Sem conexão. Tentando de novo…'); }
  });
}
setInterval(function(){ if(!document.hidden) atualizar(); },15000);
document.addEventListener('visibilitychange',function(){ if(!document.hidden) atualizar(); });

/* ---------- Dados derivados ---------- */
function projById(id){ return S.projetos.find(function(p){ return p.id===id; }); }
function visProj(){ return S.projetos.filter(function(p){ return !p.hidden; }); }
function itensDe(pid){ return S.itens.filter(function(i){ return i.projId===pid; }); }
function itensVisiveis(){
  var vis={}; visProj().forEach(function(p){ vis[p.id]=p; });
  return S.itens.filter(function(i){ return vis[i.projId]; }).map(function(i){ return {it:i,p:vis[i.projId]}; });
}
function comprarLista(){ return itensVisiveis().filter(function(x){ return x.it.tipoComprar && x.it.statusComprar==='comprar'; }); }
function alocLista(){
  var out=[];
  itensVisiveis().forEach(function(x){
    if(x.it.tipoAloc && x.it.alocs) x.it.alocs.forEach(function(a){
      var d=a.projId&&projById(a.projId); if(d) out.push({it:x.it,p:x.p,dest:d,qtd:a.qtd||x.it.qtd});
    });
  });
  return out;
}
function naoLidas(){ return S.mensagens.filter(function(m){ return m.uid!==uid && (m.ts||'')>lido; }).length; }
function projOptions(sel,primeiro){
  return '<option value="">'+esc(primeiro)+'</option>'+S.projetos.filter(function(p){ return !p.hidden||p.id===sel; }).map(function(p){
    return '<option value="'+esc(p.id)+'"'+(p.id===sel?' selected':'')+'>'+esc(p.nome)+'</option>';
  }).join('');
}

/* ---------- Entrada (código e nome) ---------- */
function gate(html){
  $('app').hidden=true; $('gate').hidden=false;
  $('gate').innerHTML='<div class="gate-card">'+html+'</div>';
  var i=$('gate').querySelector('input'); if(i) i.focus();
}
function mostrarEntrar(msg){
  gate('<h1>📦 Controle de Materiais</h1><p>Digite o código de acesso da equipe.</p>'+
    '<form id="f-entrar"><label for="g-c">Código da equipe</label><input id="g-c" type="password" autocomplete="off" autocapitalize="off" required>'+
    '<p class="erro" id="g-erro">'+esc(msg||'')+'</p><button class="btn pri" type="submit">Entrar</button></form>');
}
function mostrarDefinir(){
  gate('<h1>📦 Controle de Materiais</h1><p>Primeiro acesso. Defina o <strong>código da equipe</strong>. Quem tiver o link e este código poderá ver e alterar os dados. Use pelo menos 8 caracteres e não use uma senha de outro lugar.</p>'+
    '<form id="f-definir"><label for="g-c1">Código da equipe</label><input id="g-c1" type="password" autocomplete="off" autocapitalize="off" required>'+
    '<div style="height:10px"></div><label for="g-c2">Repita o código</label><input id="g-c2" type="password" autocomplete="off" autocapitalize="off" required>'+
    '<p class="erro" id="g-erro"></p><button class="btn pri" type="submit">Definir código</button></form>');
}
function mostrarNome(){
  gate('<h1>Qual é o seu nome?</h1><p>Ele aparece nos recebimentos e nas mensagens, para a equipe saber quem fez cada coisa.</p>'+
    '<form id="f-nome"><label for="g-n">Seu nome</label><input id="g-n" type="text" maxlength="40" autocomplete="given-name" required>'+
    '<p class="erro" id="g-erro"></p><button class="btn pri" type="submit">Continuar</button></form>');
}
function mostrarRede(){
  gate('<h1>📦 Controle de Materiais</h1><p>Não foi possível conectar. Confira a internet e tente de novo.</p><button class="btn pri" id="g-retry" type="button">Tentar de novo</button>');
}
function setErro(m){ var e=$('g-erro'); if(e) e.textContent=m; }
function msgErro(e){
  if(e==='bloqueado') return 'Muitas tentativas erradas. Aguarde 10 minutos e tente de novo.';
  if(e==='invalido') return 'Código incorreto.';
  if(e==='codigo_curto') return 'O código precisa ter pelo menos 4 caracteres.';
  return 'Algo deu errado. Tente de novo.';
}

document.addEventListener('submit',function(ev){
  var f=ev.target; if(!f||!f.id) return;
  if(f.id==='f-entrar'){
    ev.preventDefault();
    var c=$('g-c').value.trim(); if(!c) return;
    rpc('app_verificar',{p_codigo:c}).then(function(r){
      if(r.ok){ codigo=c; lsSet('cm_codigo',c); depoisDoCodigo(); } else setErro(msgErro(r.erro));
    },function(){ setErro('Sem conexão. Tente de novo.'); });
  }
  if(f.id==='f-definir'){
    ev.preventDefault();
    var a=$('g-c1').value.trim(), b=$('g-c2').value.trim();
    if(a.length<6){ setErro('Use pelo menos 6 caracteres (o ideal é 8 ou mais).'); return; }
    if(a!==b){ setErro('Os dois códigos não são iguais.'); return; }
    rpc('app_definir_codigo',{p_novo:a,p_atual:null}).then(function(r){
      if(r.ok){ codigo=a; lsSet('cm_codigo',a); depoisDoCodigo(); } else setErro(msgErro(r.erro));
    },function(){ setErro('Sem conexão. Tente de novo.'); });
  }
  if(f.id==='f-nome'){
    ev.preventDefault();
    var n=$('g-n').value.trim(); if(!n) return;
    nome=n.slice(0,40); lsSet('cm_nome',nome); iniciar();
  }
});
document.addEventListener('click',function(ev){
  if(ev.target&&ev.target.id==='g-retry') boot();
});

function depoisDoCodigo(){ if(!nome) mostrarNome(); else iniciar(); }

function boot(){
  rpc('app_status').then(function(st){
    if(!st.codigo_definido){ mostrarDefinir(); return; }
    if(!codigo){ mostrarEntrar(); return; }
    return rpc('app_verificar',{p_codigo:codigo}).then(function(r){
      if(r.ok) depoisDoCodigo();
      else { codigo=''; lsDel('cm_codigo'); mostrarEntrar(r.erro==='bloqueado'?msgErro('bloqueado'):''); }
    });
  }).catch(mostrarRede);
}

function iniciar(){
  $('gate').hidden=true; $('app').hidden=false;
  $('btn-user').textContent='👤 '+nome;
  carregar(true).then(function(ok){
    if(!ok) return;
    logado=true;
    if(!lido){ lido=new Date().toISOString(); lsSet('cm_lido',lido); }
    setTab(tab);
  }).catch(function(){ mostrarRede(); });
}

/* ---------- Janelas ---------- */
function abrir(html){
  $('modal-box').innerHTML=html; $('modal').hidden=false; document.body.classList.add('noscroll');
  var f=$('modal-box').querySelector('input:not([type=checkbox]),textarea'); if(f&&!/Mobi|Android/i.test(navigator.userAgent)) f.focus();
}
function fechar(){ $('modal').hidden=true; $('modal-box').innerHTML=''; $('modal-box').classList.remove('wide'); document.body.classList.remove('noscroll'); galIds=null; pf=null; }
function confirmar(titulo,htmlTexto,botao,onOk){
  confirmOk=onOk;
  $('confirm-box').innerHTML='<div class="conf-ico">⚠️</div><h3>'+esc(titulo)+'</h3><p>'+htmlTexto+'</p><div class="conf-btns"><button class="btn" data-act="conf-no">Cancelar</button><button class="btn bad" data-act="conf-yes">'+esc(botao)+'</button></div>';
  $('confirm').hidden=false;
}
function fecharConfirm(){ $('confirm').hidden=true; $('confirm-box').innerHTML=''; confirmOk=null; }
$('modal').addEventListener('click',function(e){ if(e.target===$('modal')) fechar(); });
$('confirm').addEventListener('click',function(e){ if(e.target===$('confirm')) fecharConfirm(); });
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){ if(!$('confirm').hidden) fecharConfirm(); else if(!$('modal').hidden) fechar(); }
});

/* ---------- Abas e atualização da tela ---------- */
var TABS=[['mat','📦','A caminho'],['proj','📁','Projetos'],['est','🏭','Estoque'],['compras','🛒','Compras'],['cot','💲','Cotação'],['msg','💬','Mensagens']];
function setTab(t){
  tab=t;
  document.querySelectorAll('.page').forEach(function(p){ p.hidden=(p.id!=='page-'+t); });
  if(t==='msg') marcarLido();
  renderAll();
  if(t==='cot') atualizar();
}
function marcarLido(){
  var mx=lido;
  S.mensagens.forEach(function(m){ if((m.ts||'')>mx) mx=m.ts; });
  if(mx!==lido){ lido=mx; lsSet('cm_lido',lido); }
}
function renderTabs(){
  $('tabs').innerHTML=TABS.map(function(x){
    var b='';
    if(x[0]==='compras'){ var c=comprarLista().length; if(c) b='<span class="notif">'+c+'</span>'; }
    if(x[0]==='msg'){ var m=naoLidas(); if(m) b='<span class="notif">'+m+'</span>'; }
    return '<button class="tab'+(tab===x[0]?' on':'')+'" data-act="tab" data-t="'+x[0]+'">'+x[1]+' '+x[2]+b+'</button>';
  }).join('');
}
function renderStats(){
  var pend_=0,rec=0,comprar=0;
  itensVisiveis().forEach(function(x){
    if(x.it.status==='rec') rec++; else if(aCaminho(x.it)) pend_++;
    if(x.it.tipoComprar&&x.it.statusComprar==='comprar') comprar++;
  });
  var livres=S.estoque.filter(function(e){ return !e.projId&&!e.retirado; }).length;
  function st(n,l,cor){ return '<div class="stat"><b'+(cor?' style="color:'+cor+'"':'')+'>'+n+'</b><span>'+l+'</span></div>'; }
  $('stats').innerHTML=st(visProj().length,'projetos')+st(pend_,'a caminho','var(--warn-fg)')+st(rec,'recebidos','var(--ok-fg)')+st(livres,'livres no estoque','var(--ok-fg)')+st(comprar,'para comprar','var(--bad-fg)');
}
function fillSelect(id,primeiro){
  var s=$(id); if(!s) return;
  var v=s.value;
  s.innerHTML=projOptions(v,primeiro);
  if(v && !S.projetos.some(function(p){ return p.id===v; })) s.value='';
}
function renderAll(){
  if(!logado) return;
  if(tab==='msg') marcarLido();
  renderTabs(); renderStats();
  fillSelect('f-mat-proj','Todos os projetos'); fillSelect('f-est-proj','Todos os projetos'); fillSelect('f-cp-proj','Todos os projetos');
  if(tab==='mat') rMat();
  if(tab==='proj') rProj();
  if(tab==='est') rEst();
  if(tab==='compras') rCompras();
  if(tab==='cot') rCot();
  if(tab==='msg') rMsg();
}
['f-mat-q','f-mat-proj','f-mat-st'].forEach(function(id){ $(id).addEventListener('input',rMat); });
['f-proj-q','f-proj-ocultos'].forEach(function(id){ $(id).addEventListener('input',rProj); });
['f-est-q','f-est-proj','f-est-st'].forEach(function(id){ $(id).addEventListener('input',rEst); });
['f-cp-q','f-cp-proj','f-cp-st'].forEach(function(id){ $(id).addEventListener('input',rCompras); });

/* ---------- Peças de tela ---------- */
function badges(it,q){
  var b='';
  if(it.tipoForn&&it.forn) b+='<span class="badge b-info">🏪 '+hl(it.forn,q)+'</span>';
  if(it.tipoComprar) b+= it.statusComprar==='comprado' ? '<span class="badge b-ok">✓ Comprado</span>' : '<span class="badge b-bad">🛒 Falta comprar</span>';
  if(it.tipoAloc&&it.alocs){
    var n=it.alocs.map(function(a){ var p=a.projId&&projById(a.projId); return p?p.nome:null; }).filter(Boolean);
    if(n.length) b+='<span class="badge b-loc">⇄ '+esc(n.join(', '))+'</span>';
  }
  return b;
}
function vazio(ic,txt){ return '<div class="empty"><div style="font-size:28px;margin-bottom:6px">'+ic+'</div>'+txt+'</div>'; }

function itemHTML(it,p,q,mostrarProj){
  var rec=it.status==='rec';
  return '<article class="item'+(rec?' is-rec':'')+'"><div class="item-main">'+
    '<div class="item-nome">'+hl(it.nome,q)+'</div>'+
    '<div class="meta">'+(mostrarProj?'<span class="chip">📁 '+esc(p.nome)+'</span>':'')+'<span>Qtd: '+esc(it.qtd||'—')+'</span>'+badges(it,q)+'</div>'+
    (it.obs?'<div class="obs">💬 '+esc(it.obs)+'</div>':'')+
    (rec?'<div class="recinfo">✓ Recebido em <strong>'+fmt(it.dataRec)+'</strong>'+(it.recPor?' por '+esc(it.recPor):'')+
      (it.qtdRec&&it.qtdRec!==it.qtd?' · chegou: '+esc(it.qtdRec):'')+(it.obsRec?' · '+esc(it.obsRec):'')+
      ' <button class="link" data-act="detalhe" data-i="'+esc(it.id)+'">detalhes</button></div>':'')+
    (rec&&it.retirado?'<div class="recinfo" style="color:var(--muted)">'+retInfoHTML(it)+'</div>':'')+
    '</div><div class="item-act">'+
    '<button class="btn sm" data-act="edit-item" data-i="'+esc(it.id)+'">Editar</button>'+
    '<button class="chegou'+(rec?' on':'')+'" data-act="chegou" data-i="'+esc(it.id)+'" title="'+(rec?'Toque de novo para desfazer':'Marcar como recebido')+'">'+(rec?'✓ Recebido':'Chegou')+'</button>'+
    '</div></article>';
}

/* ---------- Materiais ---------- */
function rMat(){
  var q=val('f-mat-q').toLowerCase(), fp=$('f-mat-proj').value, fs=$('f-mat-st').value;
  var rows=itensVisiveis().filter(function(x){
    if(fp&&x.p.id!==fp) return false;
    if(fs==='pend'){ if(!aCaminho(x.it)) return false; }
    else if(fs&&x.it.status!==fs) return false;
    if(q&&x.it.nome.toLowerCase().indexOf(q)<0&&(x.it.forn||'').toLowerCase().indexOf(q)<0) return false;
    return true;
  });
  if(fs==='rec') rows.sort(function(a,b){ return (b.it.dataRec||'').localeCompare(a.it.dataRec||''); });
  $('list-mat').innerHTML=rows.length?rows.map(function(x){ return itemHTML(x.it,x.p,q,true); }).join(''):vazio('📭',fs==='pend'?'Nenhum material a caminho no momento.':'Nenhum material encontrado.');
}

/* ---------- Projetos ---------- */
function rProj(){
  var q=val('f-proj-q').toLowerCase(), ver=$('f-proj-ocultos').checked;
  var lista=S.projetos.filter(function(p){

/* fotos: reduz o tamanho no próprio aparelho antes de enviar */
function lerArquivo(file){
  return new Promise(function(res,rej){ var r=new FileReader(); r.onload=function(){ res(r.result); }; r.onerror=function(){ rej(new Error('leitura')); }; r.readAsDataURL(file); });
}
function comprimir(file,max,alvo){
  max=max||1600; alvo=alvo||600000;
  return new Promise(function(resolve,reject){
    var url=URL.createObjectURL(file), img=new Image(), feito=false, t;
    function reserva(){
      if(feito) return; feito=true; clearTimeout(t); try{ URL.revokeObjectURL(url); }catch(e){}
      if(file.size<=alvo*0.75&&/^image\/(jpeg|png|webp)$/.test(file.type)) lerArquivo(file).then(resolve,reject);
      else reject(new Error('foto'));
    }
    t=setTimeout(reserva,15000);
    img.onload=function(){
      if(feito) return; feito=true; clearTimeout(t); try{ URL.revokeObjectURL(url); }catch(e){}
      try{
        var w0=img.naturalWidth||img.width, h0=img.naturalHeight||img.height, k=Math.min(1,max/Math.max(w0,h0));
        var w=Math.max(1,Math.round(w0*k)), h=Math.max(1,Math.round(h0*k));
        var c=document.createElement('canvas'), ctx;
        function desenhar(){ c.width=w; c.height=h; ctx=c.getContext('2d'); if(!ctx) throw new Error('canvas'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,w,h); ctx.drawImage(img,0,0,w,h); }
        desenhar();
        var q=0.78, d=c.toDataURL('image/jpeg',q);
        while(d.length>alvo&&q>0.45){ q-=0.1; d=c.toDataURL('image/jpeg',q); }
        while(d.length>alvo*1.4&&w>400){ w=Math.round(w*0.8); h=Math.round(h*0.8); desenhar(); d=c.toDataURL('image/jpeg',0.6); }
        resolve(d);
      }catch(e){ reject(e); }
    };
    img.onerror=reserva;
    img.src=url;
  });
}

A['del-proj']=function(el){

    var libera=[]; S.estoque.forEach(function(e){ if(e.projId===p.id){ e.projId=''; libera.push(e); } });

      if(i.projId!==p.id&&i.alocs&&i.alocs.some(function(a){ return a.projId===p.id; })){ i.alocs=i.alocs.filter(function(a){ return a.projId!==p.id; }); mudou.push(i); }

    var ids=its.map(function(i){ return i.id; });
    S.itens=S.itens.filter(function(i){ return i.projId!==p.id; });
    S.projetos=S.projetos.filter(function(x){ return x.id!==p.id; });
    excluirVarios('itens',ids).then(function(){ return excluirVarios('projetos',[p.id]); })
      .then(function(){ return gravarVarios('estoque',libera); }).then(function(){ return gravarVarios('itens',mudou); });

A.export=function(){
  var g={};
  comprarLista().forEach(function(x){ var k=(x.it.tipoForn&&x.it.forn)?x.it.forn:'Sem fornecedor'; (g[k]=g[k]||[]).push(x); });
  var txt='LISTA DE COMPRAS\n'+new Date().toLocaleDateString('pt-BR')+'\n\n';
  Object.keys(g).forEach(function(k){ txt+='['+k+']\n'; g[k].forEach(function(x){ txt+='  - '+x.it.nome+' | '+(x.it.qtdComprar||x.it.qtd)+' | '+x.p.nome+'\n'; }); txt+='\n'; });
  if(!Object.keys(g).length) txt+='Nada para comprar.\n';
  baixar('lista-compras.txt',txt,'text/plain');
};
function baixar(nomeArq,conteudo,tipo){
  var b=new Blob([conteudo],{type:tipo+';charset=utf-8'}), a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download=nomeArq; document.body.appendChild(a); a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); },500);
}

A['save-pedido']=function(){
  var n=val('pd-n'); if(!n){ toast('Informe o material'); return; }
  var d=$('pd-d').value; if(!d){ toast('Escolha o projeto de destino'); return; }
  var proj;
  if(d==='__geral'){
    proj=S.projetos.find(function(p){ return p.geral; });
    if(!proj){ proj={id:newId(),nome:'Estoque geral',desc:'Pedidos sem projeto definido',hidden:false,geral:true}; S.projetos.push(proj); gravar('projetos',proj); }
    else if(proj.hidden){ proj.hidden=false; gravar('projetos',proj); }
  } else proj=projById(d);
  if(!proj){ toast('Projeto não encontrado'); return; }
  var qtd=val('pd-q'), forn=val('pd-f'), obs=val('pd-o');
  var it=mkItem(proj.id,{nome:n,qtd:qtd||'—',forn:forn});
  it.tipoComprar=true; it.statusComprar='comprar'; it.qtdComprar=qtd; it.obs=obs; it.pedidoPor=nome; it.pedidoEm=new Date().toISOString();
  var m={id:newId(),autor:nome,uid:uid,tipo:'pedido',itemId:it.id,pNome:n,pQtd:qtd,pForn:forn,pDest:proj.nome,texto:obs,ts:new Date().toISOString()};
  S.itens.push(it); S.mensagens.push(m);
  gravar('itens',it).then(function(){ return gravar('mensagens',m); });
  marcarLido(); fechar(); renderAll(); toast('Pedido registrado em Compras e em Mensagens');
};

   COTAÇÃO — fornecedores, produtos (com fotos) e preços
   ===================================================================== */
var TIPOS_FORN=['WhatsApp','Mercado Livre','Site','Loja física','Outro'];
var UNIDADES=['un','caixa','metro','rolo','kg','par','pacote','barra','peça','litro'];

function norm(s){ return String(s==null?'':s).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim(); }
function lev(a,b,max){
  if(Math.abs(a.length-b.length)>max) return max+1;
  var prev=[],cur,i,j;
  for(j=0;j<=b.length;j++) prev[j]=j;
  for(i=1;i<=a.length;i++){
    cur=[i]; var min=i;
    for(j=1;j<=b.length;j++){
      var c=a.charAt(i-1)===b.charAt(j-1)?0:1;
      cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+c);
      if(cur[j]<min) min=cur[j];
    }
    if(min>max) return max+1;
    prev=cur;
  }
  return prev[b.length];
}
function palavrasProd(p){
  return [[p.nome,3],[p.apelido,3],[p.marca,1.5],[p.espec,1.5],[p.unidade,0.5]].map(function(c){
    return {w:norm(c[0]).split(' ').filter(Boolean),p:c[1]};
  });
}
function pontuar(campos,tokens){
  var total=0;
  for(var t=0;t<tokens.length;t++){
    var tk=tokens[t], best=0;
    for(var c=0;c<campos.length;c++){
      var ws=campos[c].w, peso=campos[c].p;
      for(var k=0;k<ws.length;k++){
        var w=ws[k], v=0;
        if(w===tk) v=3;
        else if(w.indexOf(tk)===0) v=2;
        else if(tk.length>=3&&w.indexOf(tk)>=0) v=1.2;
        else if(tk.length>=4){
          var mx=tk.length>=7?2:1;
          if(lev(w,tk,mx)<=mx||(w.length>tk.length&&lev(w.slice(0,tk.length),tk,mx)<=mx)) v=0.8;
        }
        if(v*peso>best) best=v*peso;
      }
    }
    if(!best) return 0;
    total+=best;
  }
  return total;
}

function money(v){ return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'}); }
function numTxt(v){ return String(+v.toFixed(4)).replace('.',','); }
function parseNum(s){
  s=String(s==null?'':s).replace(/[R$\s]/g,'');
  if(!s) return NaN;
  if(s.indexOf(',')>=0) s=s.replace(/\./g,'').replace(',','.');
  var n=parseFloat(s); return isFinite(n)?n:NaN;
}
function hojeISO(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function diasDesde(iso){
  var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso||''); if(!m) return null;
  var d=new Date(+m[1],+m[2]-1,+m[3]), h=new Date(); h=new Date(h.getFullYear(),h.getMonth(),h.getDate());
  return Math.round((h-d)/864e5);
}
function fmtData(iso){ var m=/^(\d{4})-(\d{2})-(\d{2})/.exec(iso||''); return m?m[3]+'/'+m[2]+'/'+m[1]:'—'; }
function linkSeguro(u){
  u=String(u||'').trim(); if(!u) return '';
  if(!/^https?:\/\//i.test(u)) u='https://'+u;
  try{ var x=new URL(u); return (x.protocol==='http:'||x.protocol==='https:')?x.href:''; }catch(e){ return ''; }
}
function waLink(tel){
  var d=String(tel||'').replace(/\D/g,''); if(d.length<10) return '';
  if(d.length<=11) d='55'+d;
  return 'https://wa.me/'+d;
}
function prodById(id){ return S.produtos.find(function(x){ return x.id===id; }); }
function fornById(id){ return S.fornecedores.find(function(x){ return x.id===id; }); }
function pu(r){ return r.valor/(r.qtdRef>0?r.qtdRef:1); }
function idxPrecos(){
  var ix={};
  S.precos.forEach(function(r){ var a=(ix[r.produtoId]=ix[r.produtoId]||{}); (a[r.fornId]=a[r.fornId]||[]).push(r); });
  Object.keys(ix).forEach(function(pid){ Object.keys(ix[pid]).forEach(function(fid){
    ix[pid][fid].sort(function(a,b){ return (b.data||'').localeCompare(a.data||'')||(b.ts||'').localeCompare(a.ts||''); });
  }); });
  return ix;
}
function ultimoPreco(pid,fid){
  var h=idxPrecos()[pid]; return h&&h[fid]?h[fid][0]:null;
}

/* ----- lista de produtos e preços ----- */
function cardProd(p,ix){
  var porForn=ix[p.id]||{}, linhas=[];
  Object.keys(porForn).forEach(function(fid){ var f=fornById(fid); if(f) linhas.push({f:f,ult:porForn[fid][0],ant:porForn[fid][1]}); });
  var cand=linhas.filter(function(l){ return !l.ult.semEstoque; }), min=null;
  if(cand.length>=2) min=Math.min.apply(null,cand.map(function(l){ return pu(l.ult); }));
  linhas.sort(function(a,b){ return ((a.ult.semEstoque?1:0)-(b.ult.semEstoque?1:0))||(pu(a.ult)-pu(b.ult)); });
  var un=p.unidade||'un', fid0=(p.fotos||[])[0];
  var thumb;
  if(fid0&&fotoCache[fid0]) thumb='<img src="'+esc(fotoCache[fid0])+'" alt="Foto de '+esc(p.nome)+'">';
  else if(!fid0&&p.fotoLink) thumb='<img data-fb="1" referrerpolicy="no-referrer" src="'+esc(p.fotoLink)+'" alt="Foto de '+esc(p.nome)+'">';
  else thumb='📦';
  var meta='';
  if(p.apelido) meta+='<span class="chip">🗣 '+esc(p.apelido)+'</span>';
  if(p.marca) meta+='<span class="chip">'+esc(p.marca)+'</span>';
  meta+='<span class="chip">'+esc(un)+'</span>';
  if(p.espec) meta+='<span>'+esc(p.espec)+'</span>';
  var h='<article class="pcard"><div class="pc-top">'+
    '<button class="pthumb" data-act="p-foto" data-p="'+esc(p.id)+'" aria-label="Ver foto de '+esc(p.nome)+'">'+thumb+'</button>'+
    '<div class="pc-info"><div class="pc-nome">'+esc(p.nome)+'</div><div class="meta">'+meta+'</div></div>'+
    '<div class="pc-act"><button class="btn sm" data-act="p-edit" data-p="'+esc(p.id)+'">Editar</button></div></div>';
  if(linhas.length){
    h+='<div class="frows">'+linhas.map(function(l){
      var r=l.ult, melhor=(min!==null&&!r.semEstoque&&Math.abs(pu(r)-min)<1e-9);
      var dias=diasDesde(r.data), velho=dias!==null&&dias>30;
      var tr='';
      if(l.ant){
        var a=pu(l.ant), b=pu(r);
        if(a>0&&Math.abs(b-a)>1e-9){ var pc=(b-a)/a*100; tr=' <span class="'+(pc>0?'tr-up':'tr-down')+'" title="Preço anterior: '+esc(money(a))+' por '+esc(un)+'">'+(pc>0?'↑':'↓')+' '+Math.abs(pc).toFixed(1).replace('.',',')+'%</span>'; }
      }
      var preco=(r.qtdRef===1)
        ? money(r.valor)+' <small>por '+esc(un)+'</small>'
        : money(r.valor)+' <small>por '+numTxt(r.qtdRef)+' '+esc(un)+' · '+money(pu(r))+'/'+esc(un)+'</small>';
      var badges=(melhor?'<span class="badge b-ok">✓ menor preço</span>':'')+
        (r.semEstoque?'<span class="badge b-bad">sem estoque</span>':'')+
        (velho?'<span class="badge b-warn">⚠ preço antigo ('+dias+' dias)</span>':'');
      var acoes='<button class="btn pri sm" data-act="pr-novo" data-p="'+esc(p.id)+'" data-f="'+esc(l.f.id)+'">Atualizar</button>'+
        '<button class="btn sm" data-act="pr-sem" data-p="'+esc(p.id)+'" data-f="'+esc(l.f.id)+'">'+(r.semEstoque?'Voltou ao estoque':'Sem estoque')+'</button>';
      var w=l.f.tipo==='WhatsApp'?waLink(l.f.tel):'';
      if(w) acoes+='<a class="btn sm" href="'+esc(w)+'" target="_blank" rel="noopener noreferrer">💬 WhatsApp</a>';
      if(r.link1) acoes+='<a class="btn sm" href="'+esc(r.link1)+'" target="_blank" rel="noopener noreferrer">🔗 Link</a>';
      if(r.link2) acoes+='<a class="btn sm" href="'+esc(r.link2)+'" target="_blank" rel="noopener noreferrer">🔗 Link 2</a>';
      return '<div class="frow'+(melhor?' best':'')+(r.semEstoque?' sem':'')+'"><div class="fr-main">'+
        '<div class="fr-nome">🏪 '+esc(l.f.nome)+' <span class="chip">'+esc(l.f.tipo||'')+'</span>'+badges+'</div>'+
        '<div class="fr-preco">'+preco+tr+'</div>'+
        '<div class="fr-meta">Consultado em '+fmtData(r.data)+(dias!==null?' ('+(dias===0?'hoje':dias===1?'há 1 dia':'há '+dias+' dias')+')':'')+
          (r.frete?' · frete/prazo: '+esc(r.frete):'')+(r.por?' · por '+esc(r.por):'')+'</div></div>'+
        '<div class="fr-act">'+acoes+'</div></div>';
    }).join('')+'</div>';
  }
  h+='<div class="pc-foot"><button class="btn sm" data-act="pr-novo" data-p="'+esc(p.id)+'">+ Preço'+(linhas.length?' em outro fornecedor':'')+'</button>'+
    (linhas.length?'':'<span class="hint" style="margin:0">Ainda sem preços.</span>')+'</div></article>';
  return h;
}
function rCot(){
  if(cotView==='forn'){ rForn(); return; }
  var q=val('f-cot-q'), tokens=norm(q).split(' ').filter(Boolean);
  var ix=idxPrecos();
  var lista=S.produtos.map(function(p){ return {p:p,s:tokens.length?pontuar(palavrasProd(p),tokens):1}; }).filter(function(x){ return x.s>0; });
  lista.sort(function(a,b){ return (b.s-a.s)||norm(a.p.nome).localeCompare(norm(b.p.nome)); });
  var el=$('list-cot');
  if(!S.produtos.length){ el.innerHTML=vazio('💲','Nenhum produto cadastrado ainda.<br>Use <strong>+ Novo produto</strong> ou <strong>Colar lista</strong>.'); return; }
  if(!lista.length){ el.innerHTML=vazio('🔎','Nenhum produto encontrado para “'+esc(q)+'”.<br>Confira a escrita ou cadastre em <strong>+ Novo produto</strong>.'); return; }
  var mostrar=lista.slice(0,40);
  el.innerHTML=mostrar.map(function(x){ return cardProd(x.p,ix); }).join('')+
    (lista.length>40?'<div class="hint">Mostrando 40 de '+lista.length+' produtos. Refine a busca para ver os outros.</div>':'');
  mostrar.slice(0,12).forEach(function(x){ var id=(x.p.fotos||[])[0]; if(id&&!fotoCache[id]&&!fotoTentou[id]) carregarFoto(id); });
}

A['pp-main']=function(el){ var i=+el.dataset.i, f=pf.fotos.splice(i,1)[0]; if(f){ pf.fotos.unshift(f); rPF(); } };
document.addEventListener('change',function(ev){
  var t=ev.target; if(!t||t.id!=='pp-file'||!pf) return;
  var files=[].slice.call(t.files||[]); t.value='';
  var livres=6-pf.fotos.length;
  if(files.length>livres){ toast('No máximo 6 fotos por produto'); files=files.slice(0,Math.max(livres,0)); }
  if(!files.length) return;
  toast('Preparando foto…');
  files.reduce(function(p,f){
    return p.then(function(){
      return comprimir(f,900,260000).then(function(d){ if(pf){ pf.fotos.push({id:newId(),dataUrl:d,novo:true}); rPF(); } }).catch(function(){ toast('Não consegui ler esta foto. Tente outra.'); });
    });
  },Promise.resolve());
});
A['pp-salvar']=function(el){
  var n=val('pp-n'); if(!n){ toast('Informe o nome do produto'); return; }
  var linkTxt=val('pp-l'), link=linkSeguro(linkTxt);
  if(linkTxt&&!link){ toast('O link da imagem não é válido'); return; }
  var existente=el.dataset.p?prodById(el.dataset.p):null;
  var o=existente||{id:newId()};
  var novas=pf.fotos.filter(function(f){ return f.novo; }), removidas=pf.removidas.slice(), ordem=pf.fotos.map(function(f){ return f.id; });
  o.nome=n; o.apelido=val('pp-a'); o.marca=val('pp-m'); o.unidade=val('pp-u'); o.espec=val('pp-e'); o.fotoLink=link;
  var btn=$('pp-salvar'); btn.disabled=true; btn.textContent=novas.length?'Enviando fotos…':'Salvando…';
  var p=Promise.resolve();
  novas.forEach(function(f){
    p=p.then(function(){
      return rpc('app_foto_gravar',{p_codigo:codigo,p_id:f.id,p_dados:f.dataUrl}).then(function(r){
        if(!r.ok) throw {tipo:'erro',detalhe:r.erro};
        fotoCache[f.id]=f.dataUrl;
      });
    });
  });
  p.then(function(){
    o.fotos=ordem;
    removidas.forEach(function(id){ delete fotoCache[id]; rpc('app_foto_excluir',{p_codigo:codigo,p_id:id}).catch(function(){}); });
    upsert('produtos',o); gravar('produtos',o); fechar(); renderAll(); toast('Produto salvo');
  }).catch(function(e){
    btn.disabled=false; btn.textContent='Salvar';
    toast(e&&e.tipo==='rede'?'Sem conexão. Nada foi salvo.':'Não foi possível enviar a foto. Tente de novo.');
  });
};
A['pp-excluir']=function(el){
  var p=prodById(el.dataset.p); if(!p) return;
  var rs=S.precos.filter(function(r){ return r.produtoId===p.id; });
  confirmar('Excluir produto?','Excluir <strong>“'+esc(p.nome)+'”</strong>'+(rs.length?' e os <strong>'+rs.length+' preço'+(rs.length===1?'':'s')+'</strong> registrado'+(rs.length===1?'':'s'):'')+'? Essa ação não pode ser desfeita.','Sim, excluir',function(){
    S.produtos=S.produtos.filter(function(x){ return x.id!==p.id; });
    S.precos=S.precos.filter(function(r){ return r.produtoId!==p.id; });
    (p.fotos||[]).forEach(function(id){ delete fotoCache[id]; rpc('app_foto_excluir',{p_codigo:codigo,p_id:id}).catch(function(){}); });
    excluirVarios('precos',rs.map(function(r){ return r.id; })).then(function(){ return excluirVarios('produtos',[p.id]); });
    fechar(); renderAll(); toast('Produto excluído');
  });
};
A['p-lista']=function(){
  abrir('<div class="mt"><h3>Colar lista de produtos</h3><button class="x" data-act="close" aria-label="Fechar">✕</button></div>'+
    '<div class="hint">Um produto por linha, separado por <b>|</b>. Só o nome é obrigatório:<br><code>Nome | Apelido | Marca | Unidade | Especificação</code></div>'+
    '<textarea id="pl-txt" rows="8" placeholder="Disjuntor bipolar 20A | | Steck | un | 2 polos, curva C&#10;Conector MC4 | conector picanha | | par"></textarea>'+
    '<div class="acts"><button class="btn" data-act="close">Cancelar</button><button class="btn pri" data-act="pl-salvar">Cadastrar produtos</button></div>');
};
A['pl-salvar']=function(){
  var novos=[];
  $('pl-txt').value.split('\n').forEach(function(l){
    l=l.trim(); if(l.length<2) return;
    var c=l.split('|').map(function(x){ return x.trim(); });
    if(!c[0]) return;
    novos.push({id:newId(),nome:c[0],apelido:c[1]||'',marca:c[2]||'',unidade:c[3]||'',espec:c[4]||'',fotos:[],fotoLink:''});
  });
  if(!novos.length){ toast('Nenhum produto encontrado'); return; }
  novos.forEach(function(o){ S.produtos.push(o); });
  gravarVarios('produtos',novos); fechar(); renderAll(); toast(novos.length+' produto(s) cadastrado(s)');
};

/* ----- fotos grandes ----- */
function rGal(){
  if(!galIds||!$('gal-b')) return;
  $('gal-t').textContent=galIds.nome;
  var id=galIds.ids[galCur], url=id?fotoCache[id]:null, h='';
  if(id) h=url?'<img class="big" src="'+esc(url)+'" alt="Foto do produto">':(fotoFalhou[id]?'<div class="hint">Foto indisponível.</div>':'<div class="hint">Carregando foto…</div>');
  else if(galIds.link) h='<img class="big" data-fb="1" referrerpolicy="no-referrer" src="'+esc(galIds.link)+'" alt="Foto do produto">';
  if(galIds.ids.length>1) h+='<div class="gal">'+galIds.ids.map(function(f,i){
    return '<button type="button" class="'+(i===galCur?'on':'')+'" data-act="gal-troca" data-i="'+i+'" aria-label="Foto '+(i+1)+'">'+(fotoCache[f]?'<img src="'+esc(fotoCache[f])+'" alt="">':'…')+'</button>';
  }).join('')+'</div>';
  $('gal-b').innerHTML=h;
}
A['p-foto']=function(el){
  var p=prodById(el.dataset.p); if(!p) return;
  var ids=(p.fotos||[]).slice();
  if(!ids.length&&!p.fotoLink){ toast('Este produto ainda não tem foto. Toque em Editar para adicionar.'); return; }
  abrir('<div class="mt"><h3 id="gal-t"></h3><button class="x" data-act="close" aria-label="Fechar">✕</button></div><div id="gal-b"></div>');
  galIds={ids:ids,link:p.fotoLink||'',nome:p.nome}; galCur=0;
  $('modal-box').classList.add('wide');
  ids.forEach(function(id){ if(!fotoCache[id]) carregarFoto(id); });
  rGal();
};
A['gal-troca']=function(el){ galCur=+el.dataset.i; rGal(); };

/* ----- preços ----- */
function precoModal(pid,fid){
  var p=prodById(pid); if(!p) return;
  if(!S.fornecedores.length){
    toast('Cadastre um fornecedor primeiro.');
    A['cot-view']({dataset:{v:'forn'}}); return;
  }
  var forns=S.fornecedores.slice().sort(function(a,b){ return norm(a.nome).localeCompare(norm(b.nome)); });
  var ult=fid?ultimoPreco(pid,fid):null, un=p.unidade||'un';
  abrir('<div class="mt"><h3>'+(ult?'Atualizar preço':'Novo preço')+'</h3><button class="x" data-act="close" aria-label="Fechar">✕</button></div>'+
    '<div class="hint"><strong>'+esc(p.nome)+'</strong>'+(p.apelido?' ('+esc(p.apelido)+')':'')+'</div>'+
    '<div class="field"><label for="pr-f">Fornecedor</label><select id="pr-f" style="width:100%">'+
      (fid?'':'<option value="">— escolha o fornecedor —</option>')+
      forns.map(function(f){ return '<option value="'+esc(f.id)+'"'+(f.id===fid?' selected':'')+'>'+esc(f.nome)+' ('+esc(f.tipo||'')+')</option>'; }).join('')+'</select></div>'+
    '<div class="row2"><div class="field"><label for="pr-v">Valor (R$) *</label><input id="pr-v" inputmode="decimal" value="'+(ult?esc(numTxt(ult.valor)):'')+'" placeholder="0,00"></div>'+
    '<div class="field"><label for="pr-q">O preço é para quantos '+esc(un)+'?</label><input id="pr-q" inputmode="decimal" value="'+(ult?esc(numTxt(ult.qtdRef)):'1')+'"></div></div>'+
    '<div class="row2"><div class="field"><label for="pr-d">Data da consulta</label><input id="pr-d" type="date" value="'+hojeISO()+'"></div>'+
    '<div class="field"><label for="pr-fr">Frete / prazo (opcional)</label><input id="pr-fr" value="'+esc(ult?ult.frete||'':'')+'" placeholder="Ex.: R$ 30, 3 dias"></div></div>'+
    '<div class="field"><label for="pr-l1">Link do produto (opcional)</label><input id="pr-l1" value="'+esc(ult?ult.link1||'':'')+'" placeholder="https://…"></div>'+
    '<div class="field"><label for="pr-l2">Link de reserva (opcional)</label><input id="pr-l2" value="'+esc(ult?ult.link2||'':'')+'" placeholder="https://…"></div>'+
    '<label class="check" style="margin-bottom:6px"><input type="checkbox" id="pr-se"> Sem estoque neste fornecedor</label>'+
    '<div class="hint">O preço anterior fica guardado no histórico.</div>'+
    '<div class="acts"><button class="btn" data-act="close">Cancelar</button><button class="btn pri" data-act="pr-salvar" data-p="'+esc(pid)+'">Salvar preço</button></div>');
  var v=$('pr-v'); v.focus(); if(ult) v.select();
}
document.addEventListener('change',function(ev){
  var t=ev.target; if(!t||t.id!=='pr-f') return;
  var bt=$('modal-box').querySelector('[data-act="pr-salvar"]'); if(!bt) return;
  var u=t.value?ultimoPreco(bt.dataset.p,t.value):null; if(!u) return;
  $('pr-v').value=numTxt(u.valor); $('pr-q').value=numTxt(u.qtdRef); $('pr-fr').value=u.frete||''; $('pr-l1').value=u.link1||''; $('pr-l2').value=u.link2||'';
});
A['pr-novo']=function(el){ precoModal(el.dataset.p,el.dataset.f||''); };
A['pr-salvar']=function(el){
  var pid=el.dataset.p, fid=$('pr-f').value;
  if(!fid){ toast('Escolha o fornecedor'); return; }
  var v=parseNum($('pr-v').value); if(!(v>0)){ toast('Digite o valor do preço'); return; }
  var q=parseNum($('pr-q').value); if(!(q>0)) q=1;
  var t1=val('pr-l1'), t2=val('pr-l2'), l1=linkSeguro(t1), l2=linkSeguro(t2);
  if((t1&&!l1)||(t2&&!l2)){ toast('Um dos links não é válido'); return; }
  var r={id:newId(),produtoId:pid,fornId:fid,valor:v,qtdRef:q,data:$('pr-d').value||hojeISO(),frete:val('pr-fr'),link1:l1,link2:l2,semEstoque:$('pr-se').checked,por:nome,ts:new Date().toISOString()};
  S.precos.push(r); gravar('precos',r); fechar(); renderAll(); toast('Preço salvo');
};
A['pr-sem']=function(el){
  var u=ultimoPreco(el.dataset.p,el.dataset.f); if(!u) return;
  u.semEstoque=!u.semEstoque; gravar('precos',u); renderAll(); toast(u.semEstoque?'Marcado sem estoque':'Voltou ao estoque');
};

/* ---------- Retirada do estoque (instalador levou o material) ---------- */
function limparRetirada(x){
  x.retirado=false; delete x.retiradoPor; delete x.retiradoEm; delete x.retiradoQtd; delete x.retiradoObs; delete x.retiradoReg;
}
function retInfoHTML(x){
  return '📤 Retirado por <strong>'+esc(x.retiradoPor||'—')+'</strong> em '+fmt(x.retiradoEm)+
    (x.retiradoQtd?' · levou: '+esc(x.retiradoQtd):'')+(x.retiradoObs?' · '+esc(x.retiradoObs):'')+(x.retiradoReg?' · registrado por '+esc(x.retiradoReg):'');
}
function acharReg(k,id){ return (k==='est'?S.estoque:S.itens).find(function(x){ return x.id===id; }); }
function agoraLocalInput(){
  var d=new Date(); function z(n){ return ('0'+n).slice(-2); }
  return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+'T'+z(d.getHours())+':'+z(d.getMinutes());
}
A['ret-abrir']=function(el){
  var k=el.dataset.k, x=acharReg(k,el.dataset.i); if(!x) return;
  var proj=x.projId?projById(x.projId):null, semProj=(k==='est'&&!x.projId);
  var nomes={}; S.estoque.concat(S.itens).forEach(function(y){ if(y.retiradoPor) nomes[y.retiradoPor]=1; });
  var total=(k==='item'?(x.qtdRec||x.qtd):x.qtd)||'';
  abrir('<div class="mt"><h3>📤 Retirar do estoque</h3><button class="x" data-act="close" aria-label="Fechar">✕</button></div>'+
    '<div class="hint"><strong>'+esc(x.nome)+'</strong> · Qtd no estoque: '+esc(total||'—')+(proj?'<br>Projeto: '+esc(proj.nome):'')+'</div>'+
    '<div class="field"><label for="rt-p">Quem retirou? *</label><input id="rt-p" list="lista-ret" maxlength="60" placeholder="Nome do instalador">'+
      '<datalist id="lista-ret">'+Object.keys(nomes).map(function(n){ return '<option value="'+esc(n)+'">'; }).join('')+'</datalist></div>'+
    '<div class="row2"><div class="field"><label for="rt-q">Quantidade retirada</label><input id="rt-q" value="'+esc(total==='—'?'':total)+'"></div>'+
    '<div class="field"><label for="rt-dt">Data e hora</label><input id="rt-dt" type="datetime-local" value="'+agoraLocalInput()+'"></div></div>'+
    (semProj?'<div class="field"><label for="rt-pj">Para qual projeto foi? (opcional)</label><select id="rt-pj" style="width:100%">'+projOptions('','Não informar')+'</select></div>':'')+
    '<div class="field"><label for="rt-o">Observação (opcional)</label><textarea id="rt-o" rows="2" placeholder="Ex.: levou para a obra, devolve a sobra"></textarea></div>'+
    '<div class="hint">Se ele levou só uma parte, escreva a quantidade em “Quantidade retirada”. O item inteiro sai da contagem do estoque, e a divisão por quantidade ainda não é automática.</div>'+
    '<div class="acts"><button class="btn" data-act="close">Cancelar</button><button class="btn pri" data-act="ret-salvar" data-k="'+esc(k)+'" data-i="'+esc(x.id)+'">Confirmar retirada</button></div>');
};
A['ret-salvar']=function(el){
  var k=el.dataset.k, x=acharReg(k,el.dataset.i); if(!x) return;
  var por=val('rt-p'); if(!por){ toast('Informe quem retirou'); return; }
  var dtv=val('rt-dt'), dt=dtv?new Date(dtv):new Date(); if(isNaN(dt)) dt=new Date();
  x.retirado=true; x.retiradoPor=por.slice(0,60); x.retiradoEm=dt.toISOString(); x.retiradoQtd=val('rt-q'); x.retiradoObs=val('rt-o'); x.retiradoReg=nome;
  var pj=$('rt-pj'); if(pj&&pj.value) x.projId=pj.value;
  gravar(k==='est'?'estoque':'itens',x); fechar(); renderAll(); toast('Retirada registrada');
};
A['ret-desfazer']=function(el){
  var k=el.dataset.k, x=acharReg(k,el.dataset.i); if(!x) return;
  limparRetirada(x); gravar(k==='est'?'estoque':'itens',x); renderAll(); toast('Voltou ao estoque');
};

document.addEventListener('click',function(ev){
  var el=ev.target.closest&&ev.target.closest('[data-act]'); if(!el) return;
  var f=A[el.dataset.act]; if(f) f(el);

boot();
